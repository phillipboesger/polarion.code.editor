# Custom text-master: overrides the default web.xml / web-fragment.xml rules
# to target Jakarta EE 11 (Servlet 6.1) instead of the default Servlet 5.0.
#
# Format (from jakarta-text-master.properties):
#   simple-file-name=substitution-properties-file1,substitution-properties-file2,...
#
# Substitution files are resolved relative to THIS file's directory.
#
# Only web.xml and web-fragment.xml are listed here; all other deployment
# descriptor rules (persistence.xml, ejb-jar.xml, etc.) continue to come from
# the jakartaDefaults text-master because properties are merged – the last
# matching key wins.

web.xml=web-xml-6_1.properties
web-fragment.xml=web-xml-6_1.properties
