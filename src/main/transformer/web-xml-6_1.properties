# Servlet web.xml substitution rules targeting Jakarta EE 11 (Servlet 6.1)
#
# The default jakartaDefaults rules only map:
#   version 3.1 -> 5.0  (xsi:schemaLocation http://xmlns.jcp.org namespace)
#   version 4.0 -> 5.0
# They do NOT map version 3.0 (java.sun.com namespace), so this file fills
# that gap and redirects all pre-Jakarta versions to Servlet 6.1.

# ── Namespace URL ─────────────────────────────────────────────────────────────
# Servlet 2.x / 3.0 (java.sun.com)
http\://java.sun.com/xml/ns/javaee=https://jakarta.ee/xml/ns/jakartaee
# Servlet 3.1 / 4.0 (xmlns.jcp.org)  – also listed in jakarta-direct.properties
# but we need it here because this file replaces the default web.xml rule set
http\://xmlns.jcp.org/xml/ns/javaee=https://jakarta.ee/xml/ns/jakartaee

# ── Schema location: web-app ──────────────────────────────────────────────────
web-app_2_4.xsd=web-app_6_1.xsd
web-app_2_5.xsd=web-app_6_1.xsd
web-app_3_0.xsd=web-app_6_1.xsd
web-app_3_1.xsd=web-app_6_1.xsd
web-app_4_0.xsd=web-app_6_1.xsd
web-app_5_0.xsd=web-app_6_1.xsd
web-app_6_0.xsd=web-app_6_1.xsd

# ── Schema location: web-fragment ────────────────────────────────────────────
web-fragment_2_5.xsd=web-fragment_6_1.xsd
web-fragment_3_0.xsd=web-fragment_6_1.xsd
web-fragment_3_1.xsd=web-fragment_6_1.xsd
web-fragment_4_0.xsd=web-fragment_6_1.xsd
web-fragment_5_0.xsd=web-fragment_6_1.xsd
web-fragment_6_0.xsd=web-fragment_6_1.xsd

# ── Version attribute ─────────────────────────────────────────────────────────
version\="2.4"=version="6.1"
version\='2.4'=version='6.1'
version\="2.5"=version="6.1"
version\='2.5'=version='6.1'
version\="3.0"=version="6.1"
version\='3.0'=version='6.1'
version\="3.1"=version="6.1"
version\='3.1'=version='6.1'
version\="4.0"=version="6.1"
version\='4.0'=version='6.1'
version\="5.0"=version="6.1"
version\='5.0'=version='6.1'
version\="6.0"=version="6.1"
version\='6.0'=version='6.1'
