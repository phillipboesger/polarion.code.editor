# Spins up the Polarion Docker container, deploys the built plugin JAR,
# waits for Polarion to be healthy, and runs all Playwright UI tests.
#
# A single `mvn package` produces both JARs from the one javax source tree
# (see pom.xml's DUAL-PLATFORM BUILD note). Runs once per supported Polarion
# release (matrix), each against its matching polarion-docker image and the
# matching plugin JAR:
#
#   2512 -> ghcr.io/phillipboesger/polarion-docker:v2512  (Tomcat 9  / javax)
#           …-pre2606.jar   (legacy javax build)
#   2606 -> ghcr.io/phillipboesger/polarion-docker:v2606  (Tomcat 11 / jakarta)
#           …<version>.jar  (default build)
#
# Prerequisites / Secrets:
#   PACKAGES_TOKEN – PAT with read:packages (same as used in ci.yml); also used
#                    to pull the (restricted) polarion-docker images from GHCR.
#   GITHUB_TOKEN   – automatically injected by GitHub Actions

name: UI Tests – Playwright

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright UI Tests (Polarion ${{ matrix.polarion }})
    runs-on: ubuntu-latest
    timeout-minutes: 55

    permissions:
      contents: read
      packages: read
      checks: write # required by dorny/test-reporter to write the test summary

    strategy:
      # Validate every supported Polarion release independently – one red leg
      # must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - polarion: "2512" # Tomcat 9 / javax
            image: ghcr.io/phillipboesger/polarion-docker:v2512
          - polarion: "2606" # Tomcat 11 / jakarta (Servlet 6.1)
            image: ghcr.io/phillipboesger/polarion-docker:v2606

    steps:
      # ------------------------------------------------------------------
      # 1. Source code
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # 2. Build the plugin JAR (skip unit tests – handled by ci.yml). One
      #    `mvn package` produces both the default (2606/jakarta) jar and the
      #    -pre2606 (2512/javax) jar; the deploy step below picks the one
      #    matching this matrix leg's Polarion version.
      # ------------------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      - name: Build plugin JARs
        run: mvn --batch-mode package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 3. Pre-populate the Polarion extensions volume with the plugin JAR
      #    Deploy path: /opt/polarion/polarion/extensions/custom/eclipse/plugins/
      # ------------------------------------------------------------------
      - name: Create Polarion Docker volumes
        run: |
          docker volume create polarion_repo
          docker volume create polarion_extensions

      - name: Deploy plugin as an exploded bundle dir into extensions volume
        run: |
          # 2512 leg deploys the legacy -pre2606 (javax) jar; 2606 leg deploys
          # the default jar (no suffix, jakarta) — explicit selection, not
          # `ls`'s ASCII sort (which would put -pre2606.jar before the plain
          # .jar since '-' < '.').
          if [ "${{ matrix.polarion }}" = "2512" ]; then
            JAR_NAME=$(ls target/*-pre2606.jar | head -1 | xargs basename)
          else
            JAR_NAME=$(ls target/*.jar | grep -v -- '-pre2606\.jar$' | grep -v '/original-' | head -1 | xargs basename)
          fi
          VER=$(echo "$JAR_NAME" | sed -E 's/^boesger\.polarion\.code-editor-([0-9][0-9.]*)(-pre2606)?\.jar$/\1/')
          DIR_NAME="boesger.polarion.code-editor_${VER}"
          echo "Deploying exploded bundle '$DIR_NAME' from $JAR_NAME"
          # Polarion 2606 / Tomcat 11 only mounts a plugin webapp when its
          # contextRoot (src/main/webapp) resolves to a REAL directory on disk.
          # A JAR'd bundle keeps the webapp inside the archive (no docBase) so the
          # context is silently skipped. Install the bundle EXPLODED, exactly like
          # the core webapp plugins (e.g. com.polarion.alm.wiki_x.y.z/). Tomcat 9
          # (2512) mounts exploded bundles the same way, so one code path serves both.
          docker run --rm \
            -v polarion_extensions:/ext \
            -v "$(pwd)/target:/src" \
            alpine sh -c "apk add --no-cache unzip >/dev/null && mkdir -p /ext/custom/eclipse/plugins/${DIR_NAME} && unzip -oq /src/${JAR_NAME} -d /ext/custom/eclipse/plugins/${DIR_NAME} && echo 'exploded contents:' && ls -1 /ext/custom/eclipse/plugins/${DIR_NAME}"

      # ------------------------------------------------------------------
      # 4. Start the Polarion container
      # ------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull Polarion image
        run: docker pull ${{ matrix.image }}

      - name: Start Polarion container
        run: |
          # GitHub Actions ubuntu-latest has ~7 GB RAM.
          # Reduce JVM heap so there is headroom for Chromium (~500 MB) and Node.js.
          # --shm-size=256m avoids /dev/shm exhaustion inside the container.
          docker run -d \
            --name polarion \
            --platform linux/amd64 \
            --memory 6g \
            --shm-size=256m \
            -p 80:80 \
            -p 5433:5433 \
            -p 5005:5005 \
            -e JAVA_OPTS="-Xmx3g -Xms1g" \
            -e JDWP_ENABLED=false \
            --volume polarion_repo:/opt/polarion/data/svn \
            --volume polarion_extensions:/opt/polarion/polarion/extensions \
            ${{ matrix.image }}

      # ------------------------------------------------------------------
      # 5. Install Node.js & Playwright
      #    (done before the wait step so Playwright can be used as the
      #     readiness probe – the same approach as the polarion-docker repo)
      # ------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install npm dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: tests/ui
        run: npx playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 6. Wait for Polarion to be ready
      #
      # Mirrors the polarion-docker repo's own startup check:
      #
      # Phase 1 – Apache: nc until port 80 accepts connections.
      #
      # Phase 2 – Polarion log: poll the container log for the line
      #   "Polarion started:  [ TIME ... ]" which only appears once the
      #   entire OSGi/HiveMind stack (including all plugin contributions)
      #   has been fully initialised. This is the same grep used in the
      #   polarion-docker build-and-push.yml workflow.
      #   On GitHub Actions ubuntu-latest this takes 10–13 min.
      #   Timeout: 900 s (15 min).
      # ------------------------------------------------------------------
      - name: Wait for Polarion to become ready
        run: |
          echo "⏳ Phase 1: waiting for Apache on port 80..."
          timeout 120s bash -c 'until nc -z localhost 80; do sleep 2; done'
          echo "  ✅ Apache is up after ${SECONDS}s"

          echo "⏳ Phase 2: waiting for 'Polarion started' in container log (max 900s)..."
          MAX_RETRIES=90  # 90 × 10 s = 15 min
          RETRY_COUNT=0
          SUCCESS=false

          # Stream the log live so CI output is not silent
          docker exec polarion tail -f /var/log/polarion/polarion.log &
          TAIL_PID=$!

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if docker exec polarion grep -q "Polarion started:  \[ TIME" /var/log/polarion/polarion.log 2>/dev/null; then
              echo ""
              echo "✅ Polarion started successfully after ${SECONDS}s"
              SUCCESS=true
              break
            fi

            # Fail fast on fatal JVM/OSGi errors
            if docker exec polarion grep -E "Unrecognized VM option|Could not create the Java Virtual Machine" /var/log/polarion/polarion.log 2>/dev/null | grep -q "."; then
              echo "❌ FATAL JVM error detected"
              kill $TAIL_PID 2>/dev/null || true
              docker logs polarion --tail 50
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' polarion 2>/dev/null)" != "true" ]; then
              echo "❌ Container crashed!"
              kill $TAIL_PID 2>/dev/null || true
              docker logs polarion --tail 100
              exit 1
            fi

            echo -n "."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          kill $TAIL_PID 2>/dev/null || true

          if [ "$SUCCESS" = "false" ]; then
            echo "❌ Timed out waiting for Polarion to start"
            docker logs polarion --tail 200
            exit 1
          fi

      # ------------------------------------------------------------------
      # 7. Run Playwright tests
      # ------------------------------------------------------------------
      - name: Run Playwright UI tests
        working-directory: tests/ui
        env:
          POLARION_URL: "http://localhost"
          POLARION_USER: "admin"
          POLARION_PASS: "admin"
        run: npm run test:ci

      # ------------------------------------------------------------------
      # 8. Upload artefacts (always, so failures are inspectable).
      #    Names carry the Polarion version so the two matrix legs don't clash.
      # ------------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.polarion }}
          path: tests/ui/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (screenshots & traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.polarion }}
          path: tests/ui/test-results/
          retention-days: 14

      # ------------------------------------------------------------------
      # 9. Publish test summary (pass/fail per test + failure location)
      # ------------------------------------------------------------------
      - name: Publish Playwright test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Playwright UI Tests (Polarion ${{ matrix.polarion }})
          path: tests/ui/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      # ------------------------------------------------------------------
      # 10. Dump Docker logs on failure for debugging
      # ------------------------------------------------------------------
      - name: Dump Polarion container logs on failure
        if: failure()
        run: docker logs polarion --tail 200
