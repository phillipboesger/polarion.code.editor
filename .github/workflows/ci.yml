# Runs on pull requests targeting main and pushes to main.
# Compiles the project and executes all unit tests.
#
# PREREQUISITE: The Polarion platform JARs (com.polarion.*) must be accessible
# via GitHub Packages. Set the repository secret PACKAGES_TOKEN to a Personal
# Access Token with "read:packages" permission that can read the package registry
# where the Polarion JARs are published.

name: CI – Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          # Adds a <server id="github"> entry to ~/.m2/settings.xml so that Maven
          # can authenticate against GitHub Packages using the token below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      # Single build produces both JARs from the one javax source tree: the
      # default (no-suffix) jar is the 2606/jakarta build (transformer-maven-plugin
      # rewrites the bytecode + web.xml), the -pre2606 jar is the plain javax/2512
      # build. Unit tests run once, against the javax source as compiled.
      - name: Build & test (produces default 2606 jar + -pre2606 legacy jar)
        run: mvn --batch-mode verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

  # Verification only — this job does NOT produce a shipped artifact.
  #
  # The released JARs are compiled against the stable 3.25.12 / 5.25.12 API and
  # carry a 3.25.12 Require-Bundle floor, which is what lets the -pre2606 jar
  # resolve on Polarion 2512 (a floor is a MINIMUM, so a 3.26.6 floor would lock
  # that jar out of 2512 entirely). That leaves one thing unproven: whether the
  # sources still compile against the API Polarion 2606 actually ships. This job
  # supplies exactly that proof, by overriding only the dependency versions —
  # no manifest floor and no artifact is affected.
  #
  # If this fails while "Build & Test" passes, the code has drifted onto API that
  # 2606 changed or removed; fix the source, do NOT bump polarion.version.
  #
  # Scope is `compile`, i.e. src/main only — the sources that actually ship.
  # `test-compile` is deliberately NOT used: PolarionUtilsTest hand-implements
  # ITransactionService (to dodge a Mockito inline-mock limitation), and that
  # interface is namespace-dependent across platform versions —
  # getTransaction()/getUserTransaction() return javax.transaction.* on 3.25.12
  # but jakarta.transaction.* on 3.26.6, so the stub cannot compile against both.
  # That is test scaffolding, not product code; src/main references neither.
  compile-2606:
    name: Compile against 2606 API (3.26.6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      - name: Compile against Polarion 2606 platform JARs
        run: >-
          mvn --batch-mode compile
          -Dpolarion.version=3.26.6
          -Dsubterra.version=5.26.6
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
