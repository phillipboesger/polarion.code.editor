# Runs on pull requests targeting main and pushes to main.
# Compiles the project and executes all unit tests.
#
# PREREQUISITE: The Polarion platform JARs (com.polarion.*) must be accessible
# via GitHub Packages. Set the repository secret PACKAGES_TOKEN to a Personal
# Access Token with "read:packages" permission that can read the package registry
# where the Polarion JARs are published.

name: CI – Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # TEMPORARY diagnostic: lists the versions actually published in the
  # polarion-ootb-plugins mirror for the artifacts whose version we are unsure
  # about (subterra*). Removed once the correct versions are pinned in pom.xml.
  discover-deps:
    name: Discover available dependency versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Query maven-metadata.xml from the mirror
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://maven.pkg.github.com/phillipboesger/polarion-ootb-plugins/com/polarion"
          for art in subterra.base subterra subterra.base.data platform.persistence platform; do
            echo "==================== $art ===================="
            curl -sS -H "Authorization: Bearer ${PACKAGES_TOKEN}" \
              "$BASE/$art/maven-metadata.xml" || echo "(request failed for $art)"
            echo
          done
          echo "==================== maven packages matching 'subterra' ===================="
          for page in 1 2 3 4 5; do
            resp=$(curl -sS -H "Authorization: Bearer ${PACKAGES_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/phillipboesger/packages?package_type=maven&per_page=100&page=${page}")
            n=$(echo "$resp" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            echo "$resp" | python3 -c "import sys,json;[print(p['name']) for p in json.load(sys.stdin)]" 2>/dev/null | grep -i subterra || true
            [ "$n" -lt 100 ] && break
          done

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          # Adds a <server id="github"> entry to ~/.m2/settings.xml so that Maven
          # can authenticate against GitHub Packages using the token below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      # Default profile = Polarion 2512 (javax). Runs the full unit-test suite,
      # which also enforces servlet-variant parity (CodeEditorServletVariantParityTest).
      - name: Build & test Polarion 2512 JAR (javax)
        run: mvn --batch-mode verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # Polarion 2606 (jakarta / Tomcat 11). Compiles the jakarta servlet variant
      # so namespace breakage is caught on every PR. Tests are skipped by the profile
      # (the unit tests target the javax variant exercised above).
      - name: Build Polarion 2606 JAR (jakarta)
        run: mvn --batch-mode -Ppolarion-2606 package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
